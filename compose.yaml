services:
  db:
    image: postgres:17
    environment:
      POSTGRES_USER: careerpilot
      POSTGRES_PASSWORD: local_dev_only
      POSTGRES_DB: careerpilot
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U careerpilot"]
      interval: 5s
      retries: 10
  app:
    build: .
    ports:
      - "8501:10000"
    env_file: .env
    environment:
      DATABASE_URL: postgresql://careerpilot:local_dev_only@db:5432/careerpilot
    depends_on:
      db:
        condition: service_healthy
volumes:
  pgdata:
